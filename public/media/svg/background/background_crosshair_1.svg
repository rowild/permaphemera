<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
<title id="title">Background Crosshair</title>
<desc>Registration mark / crosshair detail for archival backgrounds.</desc>

<style>
  :root { color: #ca9e51; }
  .line { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .thin { fill: none; stroke: currentColor; stroke-width: .9; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .hair { fill: none; stroke: currentColor; stroke-width: .55; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .fill { fill: currentColor; stroke: none; }
  .soft { opacity: .42; }
</style>


<g class="soft">
  <path class="thin" d="M60 10v100M10 60h100"/>
  <circle class="hair" cx="60" cy="60" r="16"/>
  <circle class="fill" cx="60" cy="60" r="2"/>
  <path class="hair" d="M60 30v-12M60 102V90M30 60H18M102 60H90"/>
  <path class="hair" d="M38 38l-8-8M82 82l8 8M82 38l8-8M38 82l-8 8"/>
</g>

</svg>
